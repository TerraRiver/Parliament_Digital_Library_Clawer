[project]
name = "parliament-digital-library"
version = "0.1.0"
description = "Playwright crawler for Parliament Digital Library (elibrary.sansad.in) metadata and PDF attachments with resume support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.50.0",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
]

[project.scripts]
pdl-crawl = "crawler.run:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]
